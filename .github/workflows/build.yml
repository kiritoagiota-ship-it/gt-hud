name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: write  # publicar o APK na pagina Releases
    steps:
      - uses: actions/checkout@v4

      # O Gradle do python-for-android exige Java 17 (o padrao do runner e 11)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Mesmas versoes do TraveteFocus, que ja geram APK sem erro
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Guarda o que o buildozer baixa e o Python/Kivy ja compilados para
      # Android: do 2o build em diante cai de ~15 para poucos minutos. A
      # chave muda sempre que o buildozer.spec muda (ai compila tudo de novo).
      - name: Cache do buildozer (~/.buildozer)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-gthud-buildozer-v1-${{ hashFiles('buildozer.spec') }}

      - name: Cache da compilacao (.buildozer/android)
        uses: actions/cache@v4
        with:
          path: .buildozer/android
          key: ${{ runner.os }}-gthud-p4a-v1-${{ hashFiles('buildozer.spec') }}

      - name: Dependencias do sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev build-essential ccache

      - name: Instalar Buildozer
        run: |
          pip install --upgrade pip wheel
          pip install Cython==0.29.36 buildozer==1.5.0

      - name: Apontar SDK e NDK 27 do runner
        run: |
          NDK_DIR=$(ls -d "$ANDROID_SDK_ROOT"/ndk/27.* | sort -V | tail -1)
          echo "SDK: $ANDROID_SDK_ROOT"
          echo "NDK: $NDK_DIR"
          sed -i "s|^android.sdk_path.*|android.sdk_path = $ANDROID_SDK_ROOT|" buildozer.spec
          sed -i "s|^android.ndk_path.*|android.ndk_path = $NDK_DIR|" buildozer.spec
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV

      # O buildozer procura o sdkmanager no caminho antigo (tools/bin);
      # no runner ele fica em cmdline-tools/latest/bin.
      - name: Atalho do sdkmanager e licencas do SDK
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/tools/bin"
          ln -sf "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
          ln -sf "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" "$ANDROID_SDK_ROOT/tools/bin/avdmanager"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      # O p4a v2026.05.09 trata rodas compiladas para Android (ex.: o
      # charset-normalizer 3.5.2, puxado por requests <- kivy) como Python
      # puro e tenta instalar com o pip do runner, que recusa: "...android_24_
      # arm64_v8a.whl is not a supported wheel on this platform". Aqui ele
      # passa a ignorar essas rodas (o requests usa o chardet no lugar).
      # Clonado fora do projeto para nao ir parar dentro do APK.
      - name: Clonar e corrigir python-for-android
        run: |
          git clone -q --depth 1 -b v2026.05.09 https://github.com/kivy/python-for-android.git "$HOME/p4a-src"
          python - <<'PY'
          import os
          p = os.path.join(os.environ["HOME"], "p4a-src", "pythonforandroid", "build.py")
          s = open(p, encoding="utf-8").read()
          old = 'filename.endswith(".whl") and not is_wheel_compatible(filename, arch, ctx)'
          assert s.count(old) == 1, "trecho do filtro de rodas nao encontrado"
          s = s.replace(old, 'filename.endswith(".whl") and not filename.endswith("-any.whl")')
          open(p, "w", encoding="utf-8").write(s)
          PY
          sed -i '/^p4a.branch/d' buildozer.spec
          sed -i "/^p4a.hook/a p4a.source_dir = $HOME/p4a-src" buildozer.spec
          grep -n "^p4a" buildozer.spec

      # Cada build ganha uma versao maior que a anterior (1.0.<n>): o celular
      # instala por cima como atualizacao, e o app mostra o numero nos Ajustes.
      - name: Numero de versao automatico
        run: |
          sed -i "s/^version = .*/version = 1.0.${{ github.run_number }}/" buildozer.spec
          grep -n "^version" buildozer.spec
          echo '{"versao": "1.0.${{ github.run_number }}"}' > versao.json

      # Mesma chave de assinatura em todo build: permite atualizar o app
      # sem desinstalar (e sem perder as viagens salvas). A chave vai para um
      # arquivo proprio: o Gradle ignora o ~/.android/debug.keystore e assina
      # com uma chave dele, entao o APK e assinado de novo no fim (igual ao
      # TraveteFocus).
      - name: Keystore de debug fixa
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/gthud.keystore
            echo "Keystore fixa restaurada: $(wc -c < ~/.android/gthud.keystore) bytes"
          else
            echo "::warning::Sem DEBUG_KEYSTORE_B64: o APK sai com chave temporaria (vai exigir desinstalar para atualizar)"
          fi

      - name: Build
        run: |
          yes | buildozer -v android debug > build.log 2>&1 || (tail -n 300 build.log; exit 1)
          tail -n 60 build.log

      # Assina de novo com a chave do secret e confere a impressao digital:
      # tem que ser a mesma do TraveteFocus em todo build.
      - name: Assinar o APK sempre com a mesma chave
        run: |
          APK=$(ls bin/*.apk | head -n 1)
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ | sort -V | tail -n 1)
          if [ -s ~/.android/gthud.keystore ]; then
            "${BT}apksigner" sign --ks ~/.android/gthud.keystore --ks-pass pass:android --key-pass pass:android "$APK" \
              || echo "::warning::A chave do secret DEBUG_KEYSTORE_B64 nao abriu (senha android): o APK ficou com a chave temporaria."
          fi
          DIG=$("${BT}apksigner" verify --print-certs "$APK" | grep -i "SHA-256 digest" | head -n 1 | awk '{print $NF}')
          echo "APK: $APK"
          echo "Impressao digital: $DIG"
          if [ "$DIG" = "94ef9ec68ebd71c6ce1cc15936c440985a0fbd5900f04694009bb3bbd50709eb" ]; then
            echo "::notice::APK assinado com a mesma chave do TraveteFocus."
          else
            echo "::warning::APK assinado com uma chave diferente da do TraveteFocus."
          fi

      # O APK vai para a pagina "Releases" (tag apk-mais-recente): baixa o
      # .apk direto (sem .zip), sempre no mesmo link, e so fica o mais novo.
      - name: Publicar APK na pagina Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls bin/*.apk | head -n 1)
          NOVO="bin/GT-HUD-1.0.${{ github.run_number }}.apk"
          cp "$APK" "$NOVO"
          gh release delete apk-mais-recente --yes --cleanup-tag || true
          gh release create apk-mais-recente "$NOVO" --target "${{ github.sha }}" --latest \
            --title "GT-HUD 1.0.${{ github.run_number }}" \
            --notes "APK mais recente do GT-HUD. Baixe o arquivo .apk abaixo e instale por cima do app."
          echo "::notice::APK publicado em Releases: GT-HUD 1.0.${{ github.run_number }}"

      - name: Log completo do build
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 3
          if-no-files-found: ignore
