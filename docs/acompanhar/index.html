<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Acompanhar corrida · GT-HUD</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root { --fundo: #04070b; --painel: #0b131c; --borda: #16303f; --ciano: #19e3ff; --texto: #eaf6fb;
          --fraco: #7fa3b3; --verde: #3be08a; --laranja: #ffa23a; --vermelho: #ff5a66; }
  /* de dia (celular de quem acompanha no tema claro): painel claro */
  @media (prefers-color-scheme: light) {
    :root { --fundo: #e9eef2; --painel: #ffffff; --borda: #c2d3da; --ciano: #00788f; --texto: #0a1a24;
            --fraco: #4a6b78; --verde: #0a8a50; --laranja: #c85a00; --vermelho: #d01f40; }
    .num { background: #eef3f6 !important; }
    #painel { box-shadow: 0 6px 24px rgba(0,0,0,.18) !important; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--fundo); color: var(--texto);
               font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #mapa { position: absolute; inset: 0; background: var(--fundo); }
  .leaflet-container { background: #0a1016; font: inherit; }
  #painel { position: absolute; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom));
            max-width: 520px; margin: 0 auto; z-index: 1000; background: var(--painel);
            border: 1px solid var(--borda); border-radius: 14px; padding: 12px 14px;
            box-shadow: 0 6px 24px rgba(0,0,0,.55); }
  #estado { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--fraco); }
  #bolinha { width: 10px; height: 10px; border-radius: 50%; background: var(--fraco); flex: none; }
  #bolinha.indo { background: var(--verde); animation: pulso 1.6s infinite; }
  #bolinha.atrasado { background: var(--laranja); }
  #bolinha.fim { background: var(--ciano); }
  #bolinha.erro { background: var(--vermelho); }
  @keyframes pulso { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { #bolinha.indo { animation: none; } }
  #destino { font-size: 18px; font-weight: 700; margin: 6px 0 10px; overflow-wrap: anywhere; }
  #numeros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  #numeros[hidden] { display: none; }
  .num { background: #0f1b27; border-radius: 10px; padding: 8px 6px; text-align: center; min-width: 0; }
  .num b { display: block; font-size: 22px; color: var(--ciano); font-variant-numeric: tabular-nums;
           white-space: nowrap; }
  .num span { font-size: 12px; color: var(--fraco); }
  #ir { display: block; margin-top: 10px; text-align: center; text-decoration: none; font-weight: 600;
        color: var(--ciano); border: 1px solid var(--ciano); border-radius: 10px; padding: 11px 12px; }
  #ir[hidden] { display: none; }
  #ir:focus-visible { outline: 3px solid var(--texto); outline-offset: 2px; }
  #centralizar { position: absolute; right: 12px; top: calc(12px + env(safe-area-inset-top)); z-index: 1000;
                 background: var(--painel); color: var(--ciano); border: 1px solid var(--ciano);
                 border-radius: 10px; padding: 10px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  #centralizar[hidden] { display: none; }
  #centralizar:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .eu { width: 34px; height: 34px; }
  .eu svg { width: 34px; height: 34px; display: block; filter: drop-shadow(0 0 6px rgba(25,227,255,.8)); }
  .chegada { width: 22px; height: 22px; border-radius: 50%; background: var(--laranja);
             border: 3px solid #04070b; box-shadow: 0 0 0 2px var(--laranja); }
  .leaflet-control-attribution { background: rgba(4,7,11,.75) !important; color: var(--fraco) !important; }
  .leaflet-control-attribution a { color: var(--ciano) !important; }
</style>
</head>
<body>
<div id="mapa" role="application" aria-label="Mapa com a posição ao vivo"></div>
<button id="centralizar" type="button" hidden>Centralizar</button>
<section id="painel" aria-live="polite">
  <div id="estado"><span id="bolinha"></span><span id="texto-estado">Carregando…</span></div>
  <div id="destino"></div>
  <div id="numeros" hidden>
    <div class="num"><b id="vel">–</b><span>km/h</span></div>
    <div class="num"><b id="falta">–</b><span>faltam</span></div>
    <div class="num"><b id="chega">–</b><span id="chega-em">chegada</span></div>
  </div>
  <a id="ir" hidden target="_blank" rel="noopener noreferrer">Traçar caminho até ele no Google Maps</a>
</section>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
"use strict";
// Página do "corrida ao vivo" do GT-HUD. O link é .../acompanhar/#<banco>/<código>:
// o que vem depois do "#" fica só neste navegador. A página lê, a cada
// LER_A_CADA_MS, a posição que o app mandou para o banco do dono.
const LER_A_CADA_MS = 3000;    // sem o canal ao vivo, pergunta ao banco a cada isso
const CONFERIR_MS = 12000;     // com o canal ao vivo funcionando, só confere de vez em quando
const ATRASADO_S = 50;        // sem posição nova por isso: avisa (parado, o app manda a cada 20 s)
const el = (id) => document.getElementById(id);

function lerLink() {
  const m = /^#?([a-z0-9.:-]+)\/([A-Za-z0-9_-]{16,64})$/.exec(location.hash);
  if (!m) return null;
  const banco = m[1], local = /^(localhost|127\.0\.0\.1):\d+$/.test(banco);
  if (!local && !/^[a-z0-9-]+(\.[a-z0-9-]+)*\.(firebaseio\.com|firebasedatabase\.app)$/.test(banco)) return null;
  return { base: (local ? "http://" : "https://") + banco + "/corridas/" + m[2] + "/pub" };
}

function decodificar(texto) {            // "polyline" com 5 casas -> [[lat, lon], ...]
  const pontos = []; let i = 0, lat = 0, lon = 0;
  while (i < texto.length) {
    for (let k = 0; k < 2; k++) {
      let resultado = 0, desloc = 0, b;
      do { b = texto.charCodeAt(i++) - 63; resultado |= (b & 31) << desloc; desloc += 5; } while (b >= 32);
      const d = (resultado & 1) ? ~(resultado >> 1) : (resultado >> 1);
      if (k === 0) lat += d; else lon += d;
    }
    pontos.push([lat / 1e5, lon / 1e5]);
  }
  return pontos;
}

async function ler(caminho) {
  const r = await fetch(link.base + caminho, { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

const hora = (segundos) => new Date(segundos * 1000).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
const distancia = (m) => m >= 1000 ? (m / 1000).toFixed(1).replace(".", ",") + " km" : Math.round(m / 10) * 10 + " m";
function haTempo(s) {
  if (s < 60) return "há " + Math.max(1, Math.round(s)) + " s";
  if (s < 3600) return "há " + Math.round(s / 60) + " min";
  return "há " + Math.floor(s / 3600) + " h";
}

function estado(classe, texto) {
  el("bolinha").className = classe;
  el("texto-estado").textContent = texto;
}

const link = lerLink();
let mapa, eu, linhaRota, linhaFeito, marcaDestino;
let vistoAntes = Date.now();
let seguindo = true, pedacos = 0, versaoRota = 0, feito = [], acabou = false;
let ultimoT = null, vistoEm = 0, ultimaPos = null, enquadrou = false;
let canal = null, canalEm = 0;          // canal ao vivo (o banco avisa na hora) e a última vez que ele falou
let desliza = null;                     // animação da seta indo de um ponto ao outro
// A seta anda PELA LINHA DA ROTA, na velocidade informada, entre uma posição e
// outra (o app manda uma a cada ~2,5 s e a rede entrega em rajadas: sem isso a
// seta dava "trancos" para a frente). rotaPts/rotaAcum: a rota e os metros até
// cada ponto; alvo: a última posição recebida, em metros da rota.
let rotaPts = [], rotaAcum = [], alvo = null, dMostrada = null, quadroAntes = 0, trilhaEm = 0, giroEl = null;
const ADIANTAR_MAX_S = 6;               // sem posição nova por isso: a seta para de andar sozinha

function medirRota(pontos) {
  rotaPts = pontos; rotaAcum = [0];
  for (let i = 1; i < pontos.length; i++) rotaAcum.push(rotaAcum[i - 1] + mapa.distance(pontos[i - 1], pontos[i]));
}

function pontoNaRota(d) {               // -> [lat, lon, rumo em graus]
  const n = rotaPts.length;
  d = Math.max(0, Math.min(rotaAcum[n - 1], d));
  let i = 0;
  while (i < n - 2 && rotaAcum[i + 1] < d) i++;
  const a = rotaPts[i], b = rotaPts[i + 1], trecho = rotaAcum[i + 1] - rotaAcum[i];
  const f = trecho > 0 ? (d - rotaAcum[i]) / trecho : 0;
  const rumo = Math.atan2((b[1] - a[1]) * Math.cos(a[0] * Math.PI / 180), b[0] - a[0]) * 180 / Math.PI;
  return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, rumo];
}

function quadroDaRota(agora) {
  requestAnimationFrame(quadroDaRota);
  const dt = Math.min(0.1, (agora - quadroAntes) / 1000);
  quadroAntes = agora;
  if (acabou || !alvo || !eu || rotaPts.length < 2 || document.hidden) return;
  const adiantado = alvo.d + alvo.v * Math.min(ADIANTAR_MAX_S, (agora - alvo.em) / 1000);
  const erro = adiantado - dMostrada;
  if (dMostrada === null || Math.abs(erro) > 250) dMostrada = adiantado;        // muito longe: vai direto
  else dMostrada += Math.max(0, alvo.v + erro * 0.9) * dt;                     // anda e corrige aos poucos
  const p = pontoNaRota(dMostrada);
  const aqui = [p[0], p[1]];
  eu.setLatLng(aqui);
  if (giroEl) giroEl.style.transform = "rotate(" + p[2].toFixed(0) + "deg)";
  if (seguindo) mapa.panTo(aqui, { animate: false });
  if (agora - trilhaEm > 500) { trilhaEm = agora; linhaFeito.setLatLngs(feito.concat([aqui])); }
}

function montarMapa() {
  mapa = L.map("mapa", { zoomControl: false, attributionControl: false }).setView([-16.6799, -49.2550], 13);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(mapa);
  L.control.attribution({ position: "topleft", prefix: false }).addTo(mapa);   // embaixo o painel tapava
  linhaRota = L.polyline([], { color: "#19e3ff", weight: 5, opacity: 0.55 }).addTo(mapa);
  linhaFeito = L.polyline([], { color: "#3be08a", weight: 6, opacity: 0.95 }).addTo(mapa);
  mapa.on("dragstart", () => { seguindo = false; el("centralizar").hidden = false; });
  el("centralizar").addEventListener("click", () => {
    seguindo = true; el("centralizar").hidden = true;
    if (ultimaPos) mapa.setView(ultimaPos, Math.max(mapa.getZoom(), 16));
  });
}

function mostrarRota(rota) {
  if (!rota || !rota.linha) return;
  versaoRota = rota.rv || 0;
  const pontos = decodificar(rota.linha);
  linhaRota.setLatLngs(pontos);
  medirRota(pontos);
  alvo = null; dMostrada = null;          // rota nova: as distâncias recomeçam
  if (marcaDestino) marcaDestino.remove();
  marcaDestino = L.marker([rota.dlat, rota.dlon], {
    icon: L.divIcon({ className: "", html: '<div class="chegada"></div>', iconSize: [22, 22], iconAnchor: [11, 11] }),
    keyboard: false, alt: "Destino"
  }).addTo(mapa);
  if (!enquadrou && pontos.length > 1) { mapa.fitBounds(L.latLngBounds(pontos), { padding: [40, 160] }); }
}

function juntarPedacos(tr) {
  if (!tr) return;
  for (const chave of Object.keys(tr).sort()) {
    const n = parseInt(chave, 10);
    if (n >= pedacos) { feito = feito.concat(decodificar(tr[chave])); pedacos = n + 1; }
  }
  linhaFeito.setLatLngs(ultimaPos ? feito.concat([ultimaPos]) : feito);
}

// A seta desliza até a posição nova (em vez de pular): mais ou menos no
// tempo entre dois envios do app, para o movimento parecer contínuo.
function deslizar(de, para, ms) {
  if (desliza) cancelAnimationFrame(desliza);
  const inicio = performance.now();
  function quadro(agora) {
    const f = Math.min(1, (agora - inicio) / ms);
    const p = [de[0] + (para[0] - de[0]) * f, de[1] + (para[1] - de[1]) * f];
    eu.setLatLng(p);
    linhaFeito.setLatLngs(feito.concat([p]));
    if (seguindo) mapa.panTo(p, { animate: false });
    desliza = f < 1 ? requestAnimationFrame(quadro) : null;
  }
  desliza = requestAnimationFrame(quadro);
}

function semAnimarAgora() {
  return document.hidden || (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
}

function mostrarPosicao(pos) {
  const anterior = ultimaPos, intervalo = Date.now() - vistoAntes;
  vistoAntes = Date.now();
  ultimaPos = [pos.lat, pos.lon];
  const giro = pos.r == null ? 0 : pos.r;
  const html = '<div class="eu" style="transform: rotate(' + Number(giro) + 'deg)">' +
    '<svg viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="#04070b" opacity=".85"/>' +
    '<path d="M17 4 L27 27 L17 21.5 L7 27 Z" fill="#19e3ff"/></svg></div>';
  const icone = L.divIcon({ className: "", html: html, iconSize: [34, 34], iconAnchor: [17, 17] });
  const primeira = !eu;
  const naRota = typeof pos.d === "number" && rotaPts.length > 1 && (pos.rv || 0) === versaoRota;
  if (!eu) eu = L.marker(ultimaPos, { icon: icone, keyboard: false, alt: "Posição atual", zIndexOffset: 500 }).addTo(mapa);
  else if (!naRota || !alvo) eu.setIcon(icone);   // (andando pela rota, quem gira a seta é a animação)
  giroEl = eu.getElement() ? eu.getElement().querySelector(".eu") : null;
  if (naRota && !semAnimarAgora()) {
    // a seta desliza pela linha da rota até aqui e segue na velocidade informada
    if (desliza) { cancelAnimationFrame(desliza); desliza = null; }
    alvo = { d: pos.d, v: (pos.v || 0) / 3.6, em: performance.now() };
    if (primeira) {
      dMostrada = pos.d;
      if (seguindo && !enquadrou) { mapa.setView(ultimaPos, 16); enquadrou = true; }
    }
  } else {
    alvo = null; dMostrada = null;       // fora da rota (ou app antigo): o jeito de antes, de ponto a ponto
  const perto = anterior && mapa.distance(anterior, ultimaPos) < 400;
  const semAnimar = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (primeira || !perto || semAnimar || document.hidden) {
    if (desliza) { cancelAnimationFrame(desliza); desliza = null; }
    eu.setLatLng(ultimaPos);
    linhaFeito.setLatLngs(feito.concat([ultimaPos]));
    if (seguindo) {
      if (!enquadrou) { mapa.setView(ultimaPos, 16); enquadrou = true; } else mapa.panTo(ultimaPos);
    }
  } else {
    if (seguindo && !enquadrou) { mapa.setView(anterior, 16); enquadrou = true; }
    deslizar(eu.getLatLng() ? [eu.getLatLng().lat, eu.getLatLng().lng] : anterior, ultimaPos,
             Math.max(600, Math.min(3500, intervalo)));
  }
  }
  el("numeros").hidden = false;
  el("vel").textContent = pos.v;
  el("falta").textContent = distancia(pos.fm || 0);
  el("chega").textContent = hora(pos.t + (pos.fs || 0));
  const min = Math.max(1, Math.round((pos.fs || 0) / 60));
  el("chega-em").textContent = "chega em " + (min >= 60 ? Math.floor(min / 60) + " h " + (min % 60) + " min" : min + " min");
  // para quem quer ir ao encontro: abre o Google Maps com a posição de agora como destino
  el("ir").href = "https://www.google.com/maps/dir/?api=1&destination=" + pos.lat.toFixed(6) + "%2C" + pos.lon.toFixed(6);
  el("ir").hidden = false;
}

function terminou(pos) {
  acabou = true;
  el("ir").hidden = true;
  if (canal) { canal.close(); canal = null; }
  if (desliza) { cancelAnimationFrame(desliza); desliza = null; }
  el("numeros").hidden = true;
  if (eu) { eu.remove(); eu = null; }
  linhaFeito.setLatLngs([]); linhaRota.setLatLngs([]);
  if (marcaDestino) { marcaDestino.remove(); marcaDestino = null; }
  el("centralizar").hidden = true;
  const quando = pos && pos.t ? " às " + hora(pos.t) : "";
  el("destino").textContent = el("destino").textContent.replace(/^Indo para /, "");
  estado("fim", pos && pos.e === "chegou" ? "Chegou ao destino" + quando + "." :
    "Compartilhamento encerrado" + quando + ".");
}

function tratarPosicao(pos) {
  if (!pos) return;
  if (pos.e === "chegou" || pos.e === "encerrou") { terminou(pos); return; }
  if (typeof pos.lat !== "number" || typeof pos.lon !== "number") return;
  if (pos.t !== ultimoT) { ultimoT = pos.t; vistoEm = Date.now(); mostrarPosicao(pos); }
}

function relogio() {
  if (acabou || ultimoT === null) return;
  const parado = (Date.now() - vistoEm) / 1000;
  if (parado > ATRASADO_S) estado("atrasado", "Sem posição nova " + haTempo(parado) + " (pode estar sem sinal).");
  else estado("indo", "Ao vivo · atualizado " + haTempo(Math.max(1, parado)));
}

// Posição nova (veio do canal ao vivo ou de uma leitura): mostra e busca o
// que mais mudou (rota recalculada, pedaços novos do caminho).
let buscando = false;
async function receber(pos) {
  if (acabou) return;
  if (pos === null && ultimoT === null) estado("", "Esperando a primeira posição…");
  tratarPosicao(pos);
  if (acabou || !pos || buscando) { relogio(); return; }
  buscando = true;
  try {
    if ((pos.rv || 0) !== versaoRota) mostrarRota(await ler("/rota.json"));
    if ((pos.n || 0) > pedacos) {
      const desde = String(pedacos).padStart(5, "0");
      juntarPedacos(await ler('/tr.json?orderBy=' + encodeURIComponent('"$key"') + '&startAt=' + encodeURIComponent('"' + desde + '"')));
    }
  } catch (e) { /* tenta de novo na próxima posição */ }
  buscando = false;
  relogio();
}

async function ciclo() {
  if (acabou) return;
  try {
    await receber(await ler("/pos.json"));
  } catch (e) {
    if (!acabou) estado("erro", "Sem conexão com o servidor. Tentando de novo…");
  }
  // com o canal ao vivo falando, a leitura vira só uma conferência
  const canalVivo = canal && Date.now() - canalEm < 15000;
  const espera = canalVivo ? CONFERIR_MS : LER_A_CADA_MS;
  if (!acabou) setTimeout(ciclo, document.hidden ? espera * 3 : espera);
}

// Canal ao vivo: o banco AVISA quando a posição muda (não é a página que
// fica perguntando). Chega em menos de um segundo. Se o navegador não tiver
// ou o canal cair, as leituras de ciclo() seguram.
function abrirCanal() {
  if (!window.EventSource || canal) return;
  try {
    canal = new EventSource(link.base + "/pos.json");
  } catch (e) { canal = null; return; }
  const chegou = (ev) => {
    canalEm = Date.now();
    let d;
    try { d = JSON.parse(ev.data); } catch (e) { return; }
    if (d && d.path === "/" && (d.data === null || typeof d.data === "object")) receber(d.data);
    else ler("/pos.json").then(receber).catch(() => {});   // mudou só um pedaço: lê inteiro
  };
  canal.addEventListener("put", chegou);
  canal.addEventListener("patch", chegou);
  canal.addEventListener("keep-alive", () => { canalEm = Date.now(); });
  canal.addEventListener("cancel", () => { if (canal) { canal.close(); canal = null; } });
  canal.onerror = () => { canalEm = 0; };   // o navegador religa sozinho; enquanto isso, ciclo() lê
}

async function comecar() {
  if (!link) { estado("erro", "Link incompleto. Peça para enviarem o link de novo."); return; }
  montarMapa();
  try {
    const tudo = await ler(".json");
    if (tudo === null) { estado("erro", "Corrida não encontrada. O link pode ser antigo."); return; }
    el("destino").textContent = tudo.destino ? "Indo para " + tudo.destino : "";
    mostrarRota(tudo.rota);
    juntarPedacos(tudo.tr);
    if (tudo.pos) tratarPosicao(tudo.pos); else estado("", "Esperando a primeira posição…");
    if (acabou && tudo.destino) el("destino").textContent = tudo.destino;
  } catch (e) {
    estado("erro", "Não consegui abrir a corrida. Confira a internet.");
  }
  setInterval(relogio, 1000);
  requestAnimationFrame(quadroDaRota);
  if (!acabou) { abrirCanal(); setTimeout(ciclo, LER_A_CADA_MS); }
}
comecar();
</script>
</body>
</html>
